defaults:
  - fno_full_traj

_target_: al4pde.models.fno_wrapper.FNOFullTrajectoryWrapper
training_type: full_trajectory
num_train_steps: 40

model:
  if_conditional: true
  width: 64
  modes: 12
  time_modes: 8
  padding: 2
  traj_len: 41
  uncertainty:
    enabled: true
    #output: log_sigma
    detach_features: false
    taps:
      - name: block0 # right after encoding and before fourier block 0 
        enabled: false
        block_idx: 0
        head:
          in_channels: ${prob_model.model_wrapper.model.width}
          hidden_channels: 256
          out_channels: 128
          num_layers: 1
          make_channel_first_input: false # input is already channel/feature first, shape [B, C, X]
          average_over_space_and_time: true
          use_end_activation: true
          #activation: gelu
      - name: block1 # after fourier block 0
        enabled: true
        block_idx: 1
        head:
          in_channels: ${prob_model.model_wrapper.model.width}
          hidden_channels: 256
          out_channels: 128
          num_layers: 1
          make_channel_first_input: false
          average_over_space_and_time: true
          use_end_activation: true
          #activation: gelu
      - name: block2 # after fourier block 1
        enabled: true
        block_idx: 2
        head:
          in_channels: ${prob_model.model_wrapper.model.width}
          hidden_channels: 256
          out_channels: 128
          num_layers: 1
          make_channel_first_input: false
          average_over_space_and_time: true
          use_end_activation: true
          #activation: gelu
      - name: block3 # after fourier block 2
        enabled: true
        block_idx: 3
        head:
          in_channels: ${prob_model.model_wrapper.model.width}
          hidden_channels: 256
          out_channels: 128
          num_layers: 1
          make_channel_first_input: false
          average_over_space_and_time: true
          use_end_activation: true
          #activation: gelu
      - name: block4 # after fourier block 3
        enabled: true
        block_idx: 4
        head:
          in_channels: ${prob_model.model_wrapper.model.width}
          hidden_channels: 256
          out_channels: 128
          num_layers: 1
          make_channel_first_input: false
          average_over_space_and_time: true
          use_end_activation: true
          #activation: gelu
      - name: block5 # after first decoding layer
        enabled: true
        block_idx: 5
        head:
          in_channels: 128 # fixed at 128 in FNO1d/2d implementation
          hidden_channels: 256
          out_channels: 128 # learning loss conventional output size
          num_layers: 1
          make_channel_first_input: true # output from decoding layer is [B, X, T, C]
          average_over_space_and_time: true
          use_end_activation: true
          #activation: gelu
      - name: after_last_decoder # after second decoding layer
        enabled: false
        block_idx: 6
        head:
          in_channels: ${prob_model.model_wrapper.model.num_channels} # this cannot be changed
          hidden_channels: 256
          out_channels: 128 # learning loss conventional output size
          num_layers: 1
          make_channel_first_input: true # output from decoding layer is [B, X, T, C + num_pde_params]
          average_over_space_and_time: true
          use_end_activation: true
          #activation: gelu
      - name: last # the final fully connected block after features from all unc heads have been concatted
        enabled: true # must be enabled if uncertainty is enabled
        block_idx: 7
        head:
          hidden_channels: 256
          out_channels: 1 # should generally be 1 for learning loss. Config option remains here to maintain compatability with regular unc prediction mode
          num_layers: 1
          make_channel_first_input: false
          use_end_activation: false
          # softplus is used at the end for positivity constraint that is gentle with gradients. 
          # do not use both an activation and softplus.
          use_end_softplus: true 
          #activation: gelu