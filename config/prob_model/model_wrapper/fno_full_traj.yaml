defaults:
  - base
  - scheduler: cosine

_target_: al4pde.models.fno_wrapper.FNOFullTrajectoryWrapper
training_type: 'full_trajectory'
encode_pde_param_log: false
block_grad: false
add_one_step: false

optimizer:
  _target_: torch.optim.Adam
  lr: 1.e-3
  weight_decay: 0.0

model:
  if_conditional: true
  num_channels: 1
  modes: 12
  time_modes: 8
  width: 64
  padding: 2
  # Full-trajectory FNOs output [batch, spatial..., traj_len, channels]
  # in one forward pass. Set this to the training target yy.shape[-2].
  traj_len: 5
