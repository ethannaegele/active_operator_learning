            step_batch: -1
            t_train: 201
            time_coord_mode: abs_time
            time_coord_norm_mode: null
            training_type: full_trajectory
            val_period: 20
            vis_period: 1000
        num_models_ensemble: 1
        synchronized_training: false
        unc_model:
            _target_: al4pde.prob_models.unc_model.UncertaintyModelFullTrajectory1dTimeIndep
            activation:
                _target_: torch.nn.ReLU
            distribution: normal
            fully_connected_out_features: 128
            hidden_units: 16
            if_conditional: true
            max_pool_output_size: 8
            time_coord_mode: abs_time
            traj_len: 41
