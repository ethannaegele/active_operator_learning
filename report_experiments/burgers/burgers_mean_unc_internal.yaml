acquisition:
  _target_: al4pde.acquisition.uncertainty_based.UncertaintyBased
  batch_size: ${task.data_gen.batch_size}
  data_schedule:
    _target_: al4pde.acquisition.data_schedule.LinearSchedule
    first_batch_num: ${task.data_gen.num_initial_batches}
  pool_size: 100000
  selection_mode: power
  unc_eval_mode: mean
  unc_num_rollout_steps_rel: 1
checkpoint_file_name: latest.pt
checkpoint_id: c1papzmi
num_al_iter: 10
num_epochs: 400
prob_model:
  _target_: al4pde.prob_models.mean_unc_internal.MeanUnc
  first_model_prediction: true
  learning_loss_lambda: 1
  learning_loss_margin: 1
  loss_prediction_raw: false
  model_wrapper:
    _target_: al4pde.models.fno_wrapper.FNOFullTrajectoryWrapper
    add_one_step: false
    batch_size: 32
    block_grad: false
    encode_pde_param_log: false
    loss:
      _target_: al4pde.models.loss.MSE
      normalize_channels: false
    max_grad_norm: 50
    model:
      if_conditional: true
      modes: 12
      num_channels: 1
      padding: 2
      time_modes: 8
      traj_len: 41
      uncertainty:
        clamp_log_sigma: false
        detach_features: false
        enabled: true
        max_log_sigma: 2
        min_log_sigma: -8
        taps:
        - block_idx: 0
          enabled: false
          head:
            hidden_channels: 256
            in_channels: ${prob_model.model_wrapper.model.width}
            make_channel_first_input: false
            num_layers: 1
            out_channels: 128
            use_end_activation: true
          name: block0
        - block_idx: 1
          enabled: true
          head:
            hidden_channels: 256
            in_channels: ${prob_model.model_wrapper.model.width}
            make_channel_first_input: false
            num_layers: 1
            out_channels: 32
            use_end_activation: true
          name: block1
        - block_idx: 2
          enabled: true
          head:
            hidden_channels: 256
            in_channels: ${prob_model.model_wrapper.model.width}
            make_channel_first_input: false
            num_layers: 1
            out_channels: 32
            use_end_activation: true
          name: block2
        - block_idx: 3
          enabled: true
          head:
            hidden_channels: 256
            in_channels: ${prob_model.model_wrapper.model.width}
            make_channel_first_input: false
            num_layers: 1
            out_channels: 32
            use_end_activation: true
          name: block3
        - block_idx: 4
          enabled: true
          head:
            hidden_channels: 256
            in_channels: ${prob_model.model_wrapper.model.width}
            make_channel_first_input: false
            num_layers: 1
            out_channels: 32
            use_end_activation: true
          name: block4
        - block_idx: 5
          enabled: true
          head:
            hidden_channels: 256
            in_channels: 128
            make_channel_first_input: true
            num_layers: 1
            out_channels: 32
            use_end_activation: true
          name: block5
        - block_idx: 6
          enabled: false
          head:
            hidden_channels: 256
            in_channels: ${prob_model.model_wrapper.model.num_channels}
            make_channel_first_input: true
            num_layers: 1
            out_channels: 128
            use_end_activation: true
          name: after_last_decoder
        - block_idx: 7
          enabled: true
          head:
            hidden_channels: 256
            make_channel_first_input: false
            num_layers: 1
            out_channels: ${prob_model.model_wrapper.model.num_channels}
            use_end_activation: false
          name: last
      width: 64
    noise: 0.001
    noise_mode: constant
    norm_mode: first
    num_train_steps: 40
    num_workers: 0
    optimizer:
      _target_: torch.optim.Adam
      lr: 0.001
      weight_decay: 0
    scheduler:
      _target_: pdearena.lr_scheduler.LinearWarmupCosineAnnealingLR
      eta_min: 1e-05
      max_epochs: ${num_epochs}
      warmup_epochs: 0
      warmup_start_lr: 1e-08
    step_batch: -1
    t_train: 201
    time_coord_mode: abs_time
    time_coord_norm_mode: null
    training_type: full_trajectory
    val_period: 20
    vis_period: 1000
  num_models_ensemble: 2
  synchronized_training: false
  unc_model_prediction_mode: unc
restore_checkpoint: false
seed: 3
start_al_iter: 0
task:
  _target_: al4pde.tasks.task.Task
  data_gen:
    batch_size: 200
    num_initial_batches: 1
    num_test_batches: 64
  data_path: data/data
  ic_gen:
    _target_: al4pde.tasks.ic_gen.ic_gen_burgers.ICGenBurgers
    k_tot: 4
    num_choice_k: 2
    nx: 1024
    xL: 0
    xR: 1
  initial_step: 1
  param_gen:
    _target_: al4pde.tasks.param_gen.PDEParamGenerator
    log_scale: true
    max_val: 1
    min_val: 0.001
  reduced_batch: 1
  reduced_resolution: 4
  reduced_resolution_t: 5
  run_save_path: data/runs
  save_in_reduced_res: false
  sim:
    _target_: al4pde.tasks.sim.burgers.BurgersSim
    CFL: 0.25
    dt: 0.01
    fin_time: 2
    if_norm: false
    if_second_order: 1
    ini_time: 0
    show_steps: 100
  skip_initial_steps: 0
  use_test: false
wandb:
  group: burgers
  name: burgers_fno_full_traj_power_acq_mean_unc_internal_10_iter_400_epoch_1_lyr_32_out_32_batch_warm_start_false_seed_${seed}
  project: al4pde
warm_start_weights: false
hydra:
  output_subdir: null
  run:
    dir: .
