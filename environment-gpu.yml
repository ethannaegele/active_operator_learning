name: al-env-gpu

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.14
  - pip
  - numpy=1.26.4
  - scipy
  - scikit-learn
  - scikit-image
  - pandas
  - matplotlib
  - pillow
  - h5py
  - pyyaml
  - requests
  - tqdm
  - ipython
  - pytest
  - pip:
      # Local/project installs
      - -e ./external/pdearena[datagen]
      - -e .

      # PyTorch CUDA wheels
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.2.2+cu121
      - torchvision==0.17.2+cu121
      - torchaudio==2.2.2+cu121

      # JAX stack
      - jax==0.4.38
      - jaxlib==0.4.38
      - jax-cfd==0.2.0
      - chex==0.1.86
      - dm-haiku==0.0.12
      - flax==0.8.2
      - optax==0.2.2
      - orbax-checkpoint==0.11.5
      - tensorstore==0.1.78
      - jmp==0.0.4
      - tree-math

      # Hydra/config
      - hydra-core==1.3.2
      - hydra-submitit-launcher==1.2.0
      - omegaconf==2.3.0

      # Geometric/deep learning packages
      - cliffordlayers==0.1.1
      - einops
      - lightning==2.2.1
      - pytorch-lightning
      - lightning-utilities
      - torchdata
      - torchmetrics

      # PDE / simulation / scientific stack
      - diffusers
      - fdtd
      - phiflow
      - pyvista
      - vtk
      - xarray
      - openml
      - liac-arff
      - mat4py
      - seaborn
      - tabulate
      - humanize

      # Logging / experiment tracking
      - wandb
      - tensorboard
      - tensorboard-data-server
      - sentry-sdk
      - setproctitle

      # Hugging Face / data / IO
      - huggingface-hub
      - hf-xet
      - fsspec
      - pooch
      - minio
      - pyarrow
      - h5py
      - xmltodict
      - simplejson
      - pycryptodome

      # HTTP / async / utilities
      - aiohttp
      - aiohappyeyeballs
      - aiosignal
      - async-timeout
      - anyio
      - attrs
      - frozenlist
      - multidict
      - propcache
      - yarl
      - httpx
      - httpcore
      - h11
      - idna
      - packaging
      - platformdirs
      - click
      - typer
      - shellingham
      - rich
      - pygments
      - markdown
      - markdown-it-py
      - mdurl
      - regex
      - tomlkit
      - toolz
      - tqdm
      - appdirs
      - cloudpickle
      - dill
      - msgpack
      - nest-asyncio
      - psutil
      - submitit
      - docker-pycreds
      - gitpython
      - gitdb
      - smmap
      - grpcio
      - protobuf
      - importlib-resources
      - etils
      - jsonargparse
      - juliapkg
      - semver
      - bmdal-reg
      - annotated-doc
      - antlr4-python3-runtime
      - argon2-cffi
      - argon2-cffi-bindings
      - cffi
      - pycparser
      - pytest-explicit
      - pytest-mock
      - scooby
      - werkzeug